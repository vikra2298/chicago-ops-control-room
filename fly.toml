# fly.toml app configuration file generated for chicago-ops-control-room
app = 'chicago-ops-control-room'
primary_region = 'ord'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[env]
  ADDR = ':8080'
  DB_PATH = '/app/data/ops.db'
